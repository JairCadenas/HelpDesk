<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Help Desk Escolar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">🛠️ Mesa de Ayuda Escolar</a>
        <a href="index.html" class="btn btn-secondary btn-sm">&larr; Volver al Inicio</a>
    </nav>

    <div class="login-wrapper">
        <div class="card">
            <h2 style="margin-bottom: 6px;">Acceso al Portal</h2>
            <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 16px;">
                Ingresa tus credenciales según tu perfil asignado.
            </p>

            <div class="demo-box">
                <strong>Cuentas de prueba:</strong><br>
                • Solicitante A: <code>solicitante1</code> / <code>1234</code><br>
                • Solicitante B: <code>solicitante2</code> / <code>1234</code><br>
                • Soporte Técnico: <code>soporte1</code> / <code>1234</code>
            </div>

            <form id="login-form">
                <div style="margin-bottom: 12px;">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ej. solicitante1" required>
                </div>
                <div style="margin-bottom: 18px;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Entrar al Sistema</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
