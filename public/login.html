<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Help Desk FIF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth">

    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2z"/><path d="M3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/><path d="M18 17v1a3 3 0 0 1-3 3h-2"/></svg>
            </span>
            Help Desk FIF
        </a>
        <a href="index.html" class="btn btn-secondary btn-sm">&larr; Inicio</a>
    </nav>

    <div class="login-wrapper">
        <div class="card">
            <h2>Acceso al portal</h2>
            <p class="login-sub">Ingresa tus credenciales según tu perfil asignado.</p>

            <div class="demo-box">
                <strong>Cuentas de prueba</strong>
                <div class="chips">
                    <button type="button" class="chip" data-u="solicitante1" data-p="1234">solicitante1</button>
                    <button type="button" class="chip chip-purple" data-u="solicitante2" data-p="1234">solicitante2</button>
                    <button type="button" class="chip chip-green" data-u="soporte1" data-p="1234">soporte1</button>
                </div>
                <p class="demo-hint">Toca una cuenta para rellenar los campos (contraseña: <code>1234</code>).</p>
            </div>

            <form id="login-form">
                <div class="field">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ej. solicitante1" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-lg btn-block">Entrar al sistema</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.querySelectorAll('.chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                document.getElementById('usuario').value = chip.dataset.u;
                var pass = document.getElementById('password');
                pass.value = chip.dataset.p;
                pass.focus();
            });
        });
    </script>
</body>
</html>
