<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Solicitante | Help Desk FIF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2z"/><path d="M3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/><path d="M18 17v1a3 3 0 0 1-3 3h-2"/></svg>
            </span>
            Help Desk FIF
        </a>
        <div class="nav-user">
            <span id="user-info"></span>
            <button onclick="cerrarSesion()" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <main class="container">
        <!-- Formulario de nuevo reporte -->
        <section class="card solicitante-form">
            <div class="section-header">
                <div>
                    <h2>Levantar Nuevo Reporte de Falla</h2>
                    <p>Describe el problema y recibirás un folio de seguimiento.</p>
                </div>
            </div>
            <form id="ticket-form">
                <div class="form-grid">
                    <div>
                        <label for="asunto">Asunto breve</label>
                        <input type="text" id="asunto" placeholder="Ej. Proyector sin señal en Aula 4" required>
                    </div>
                    <div>
                        <label for="categoria">Categoría del equipo</label>
                        <select id="categoria" required>
                            <option value="Proyectores">Proyectores</option>
                            <option value="Cables">Cables y Conectores</option>
                            <option value="Cámaras">Cámaras de Seguridad</option>
                            <option value="Mobiliario">Mobiliario (Mesas/Sillas)</option>
                            <option value="Eléctrico">Instalación Eléctrica</option>
                            <option value="Red e Internet">Red e Internet</option>
                            <option value="Equipo de Computo">Equipo de Cómputo</option>
                        </select>
                    </div>
                    <div>
                        <label for="prioridad">Nivel de Prioridad</label>
                        <select id="prioridad" required>
                            <option value="Baja">Baja</option>
                            <option value="Media" selected>Media</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="descripcion">Descripción detallada y ubicación</label>
                    <textarea id="descripcion" rows="3" placeholder="Indica el edificio, número de aula y qué ocurre exactamente..." required></textarea>
                </div>

                <div class="field">
                    <label for="evidencia">Adjuntar evidencia (imagen o documento opcional)</label>
                    <input type="file" id="evidencia" accept="image/*,.pdf,.doc,.docx">
                </div>

                <button type="submit" class="btn btn-lg">Generar Folio de Incidencia</button>
            </form>
        </section>

        <!-- Listado de folios propios -->
        <section class="card">
            <div class="section-header">
                <h2>Mis Folios Reportados</h2>
                <select id="filtro-estado" onchange="cargarMisFolios()" style="width: auto;">
                    <option value="">Todos los estados</option>
                    <option value="Abierto">Abierto</option>
                    <option value="En atención">En atención</option>
                    <option value="Resuelto">Resuelto</option>
                </select>
            </div>
            <div id="mis-tickets"></div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="solicitante.js"></script>
</body>
</html>
