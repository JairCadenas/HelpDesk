<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Soporte | Help Desk FIF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2z"/><path d="M3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/><path d="M18 17v1a3 3 0 0 1-3 3h-2"/></svg>
            </span>
            Help Desk FIF
        </a>
        <div class="nav-user">
            <span id="user-info"></span>
            <button onclick="cerrarSesion()" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <main class="container">
        <!-- Resumen rápido -->
        <div class="stats-grid">
            <div class="stat-box stat-abierto"><span id="count-abierto">0</span>Abiertos</div>
            <div class="stat-box stat-atencion"><span id="count-atencion">0</span>En atención</div>
            <div class="stat-box stat-resuelto"><span id="count-resuelto">0</span>Resueltos</div>
        </div>

        <!-- Filtros y bandeja general -->
        <section class="card">
            <div class="section-header">
                <h2>Bandeja General de Incidencias</h2>
            </div>
            <div class="filters">
                <div class="form-grid">
                    <div>
                        <label for="filtro-estado">Filtrar por Estado</label>
                        <select id="filtro-estado" onchange="cargarBandeja()">
                            <option value="">Todos</option>
                            <option value="Abierto">Abierto</option>
                            <option value="En atención">En atención</option>
                            <option value="Resuelto">Resuelto</option>
                        </select>
                    </div>
                    <div>
                        <label for="filtro-categoria">Filtrar por Categoría</label>
                        <select id="filtro-categoria" onchange="cargarBandeja()">
                            <option value="">Todas</option>
                            <option value="Proyectores">Proyectores</option>
                            <option value="Cables">Cables</option>
                            <option value="Cámaras">Cámaras</option>
                            <option value="Mobiliario">Mobiliario</option>
                            <option value="Eléctrico">Eléctrico</option>
                            <option value="Red e Internet">Red e Internet</option>
                            <option value="Equipo de Computo">Equipo de Cómputo</option>
                        </select>
                    </div>
                    <div>
                        <label for="filtro-prioridad">Filtrar por Prioridad</label>
                        <select id="filtro-prioridad" onchange="cargarBandeja()">
                            <option value="">Todas</option>
                            <option value="Baja">Baja</option>
                            <option value="Media">Media</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="bandeja-tickets"></div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="soporte.js"></script>
</body>
</html>
